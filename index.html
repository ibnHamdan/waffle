<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Waffle | لعبة وافل</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="waffle.css">
    <script src="words.js"></script>
    <script src="waffle.js" defer></script>
</head>
<body>
    <header class="topbar">
        <button class="topbar-btn info-btn" aria-label="معلومات">&#9432;</button>
        <h1 class="topbar-title">وافل</h1>
        <button class="topbar-btn theme-btn" aria-label="تبديل المظهر">&#9789;</button>
    </header>
    <div class="game" id="game">
        <div class="grid-container">
            <section class="grid" tabindex="0"></section>
            <div class="warning-overlay">
                <div class="warning">فشل في إنشاء اللعبة. يرجى المحاولة مرة أخرى.</div>
            </div>
        </div>
        <p class="moves"><span class="swapCounter">0</span> <span class="swapNoun">تقلبات</span> متبقية</p>
        <p class="controls">
            <button class="newGame">لعبة جديدة</button>
            <button class="reset">إعادة تعيين</button>
            <button class="reshuffle">إعادة ترتيب</button>
        </p>
    </div>
</body>
</html>
